name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # nightly 03:00 UTC for adversarial-extended

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  import-smoke:
    name: Import Smoke Test (ComfyUI loader)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-quality.txt
      - name: Bootstrap project-local Python
        run: python scripts/bootstrap_project_venv.py
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Supply-chain hardening check
        run: |
          python scripts/check_supply_chain_hardening.py
      - name: Install import deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numpy pillow
      - name: R120 preflight
        run: |
          python scripts/preflight_check.py --strict
      - name: Import smoke test
        env:
          OPENCLAW_STATE_DIR: ${{ github.workspace }}/openclaw_state/_ci_smoke
        run: |
          python scripts/run_unittests.py --module tests.test_comfyui_loader_import


  frontend-e2e:
    name: Frontend E2E (Playwright)
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-quality.txt
      - name: Bootstrap project-local Python
        run: python scripts/bootstrap_project_venv.py
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Supply-chain hardening check
        run: |
          python scripts/check_supply_chain_hardening.py
      - name: Install preflight deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: R120 preflight
        run: |
          python scripts/preflight_check.py --strict
      - name: Install Node deps
        run: |
          npm ci
      - name: Install Playwright browsers
        run: |
          npx playwright install chromium
      - name: Run E2E
        run: |
          npm test



  unit-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-quality.txt
      - name: Bootstrap project-local Python
        run: python scripts/bootstrap_project_venv.py
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Supply-chain hardening check
        run: |
          python scripts/check_supply_chain_hardening.py
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          # Keep aligned with local pre-push/full-test scripts.
          # aiohttp is required by multiple unit-test import paths.
          # CRITICAL: Python 3.10 coverage reads pyproject.toml only when the
          # TOML extra is present; do not downgrade this back to plain coverage.
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-quality.txt
          python -m pip install numpy pillow aiohttp "coverage[toml]"
      - name: R120 preflight
        run: |
          python scripts/preflight_check.py --strict
      - name: Static-analysis policy
        run: |
          python scripts/verify_static_analysis_policy.py
      - name: Run MAE hard-guarantee suites
        env:
          OPENCLAW_STATE_DIR: ${{ github.workspace }}/openclaw_state/_ci_mae
        run: |
          # CRITICAL: keep these as explicit CI gates so public MAE route-plane
          # classification/regression drift cannot silently bypass full discovery.
          python scripts/run_unittests.py --module tests.test_s60_mae_route_segmentation --enforce-skip-policy tests/skip_policy.json --max-skipped 0
          python scripts/run_unittests.py --module tests.test_s60_routes_startup_gate --enforce-skip-policy tests/skip_policy.json --max-skipped 0
          python scripts/run_unittests.py --module tests.security.test_endpoint_drift --enforce-skip-policy tests/skip_policy.json --max-skipped 0
      - name: Run unit tests

        env:
          OPENCLAW_STATE_DIR: ${{ github.workspace }}/openclaw_state/_ci_unit
        run: |
          python scripts/run_backend_coverage.py --start-dir tests --pattern "test_*.py" --enforce-skip-policy tests/skip_policy.json --coverage-json .tmp/coverage/backend_unit_coverage.json
      - name: Coverage hotspot report
        run: |
          python scripts/report_coverage_governance.py --coverage-json .tmp/coverage/backend_unit_coverage.json

  backend-e2e-real:
    name: Backend E2E (real-backend lane, low-mock)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-quality.txt
      - name: Bootstrap project-local Python
        run: python scripts/bootstrap_project_venv.py
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Supply-chain hardening check
        run: |
          python scripts/check_supply_chain_hardening.py
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numpy pillow aiohttp
      - name: R120 preflight
        run: |
          python scripts/preflight_check.py --strict
      - name: Run real-backend lane
        env:
          OPENCLAW_STATE_DIR: ${{ github.workspace }}/openclaw_state/_ci_backend_e2e_real
        run: |
          # CRITICAL: this lane must stay low-mock and exercise real aiohttp request flow.
          python scripts/run_unittests.py --module tests.test_r122_real_backend_lane --enforce-skip-policy tests/skip_policy.json --max-skipped 0
          # R123: model-list loopback/private-IP SSRF parity must remain no-skip.
          python scripts/run_unittests.py --module tests.test_r123_real_backend_model_list_lane --enforce-skip-policy tests/skip_policy.json --max-skipped 0

  contract-tests:
    name: Contract Tests (R52)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-quality.txt
      - name: Bootstrap project-local Python
        run: python scripts/bootstrap_project_venv.py
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Supply-chain hardening check
        run: |
          python scripts/check_supply_chain_hardening.py
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numpy pillow aiohttp pytest-asyncio
      - name: R120 preflight
        run: |
          python scripts/preflight_check.py --strict
      - name: Run contract tests
        run: |
          python -m pytest tests/contract -v

  security-audit:
    name: Security Audit (S23)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-quality.txt
      - name: Bootstrap project-local Python
        run: python scripts/bootstrap_project_venv.py
      - name: Supply-chain hardening check
        run: |
          python scripts/check_supply_chain_hardening.py
      - name: Frontend Audit (npm)
        run: |
          # Development tooling is part of the build/test trust boundary.
          npm ci
          # IMPORTANT: keep registry retries/time bounded and fail closed; removing these
          # bounds can hang a run, while `continue-on-error` would hide a failed audit.
          npm audit --audit-level=high --fetch-retries=2 --fetch-timeout=120000
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Backend Audit (pip)
        run: |
          # IMPORTANT: audit declared project deps, not the whole CI tool environment.
          # Env-wide `pip-audit` also scans pip-audit's own transient dependencies and
          # can fail on toolchain-only packages that are outside the repo dependency contract.
          pip-audit -r requirements.txt

  adversarial-smoke:
    name: Adversarial Gate (adaptive)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-quality.txt
      - name: Bootstrap project-local Python
        run: python scripts/bootstrap_project_venv.py
      - name: Supply-chain hardening check
        run: |
          python scripts/check_supply_chain_hardening.py
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numpy pillow aiohttp
      - name: R120 preflight
        run: |
          python scripts/preflight_check.py --strict
      - name: R118 adversarial adaptive (auto profile)
        env:
          OPENCLAW_STATE_DIR: ${{ github.workspace }}/openclaw_state/_ci_adversarial
          OPENCLAW_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OPENCLAW_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/run_adversarial_gate.py --profile auto --seed 42 --artifact-dir .tmp/adversarial
      - name: Upload adversarial artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: adversarial-adaptive-manifest
          path: .tmp/adversarial/
          retention-days: 30

  adversarial-extended:
    name: Adversarial Gate (extended, nightly/manual)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-quality.txt
      - name: Bootstrap project-local Python
        run: python scripts/bootstrap_project_venv.py
      - name: Supply-chain hardening check
        run: |
          python scripts/check_supply_chain_hardening.py
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numpy pillow aiohttp
      - name: R120 preflight
        run: |
          python scripts/preflight_check.py --strict
      - name: R118 adversarial extended
        env:
          OPENCLAW_STATE_DIR: ${{ github.workspace }}/openclaw_state/_ci_adversarial_ext
        run: |
          python scripts/run_adversarial_gate.py --profile extended --artifact-dir .tmp/adversarial-extended
      - name: Upload adversarial artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: adversarial-extended-manifest
          path: .tmp/adversarial-extended/
          retention-days: 90

  python-compatibility:
    name: Python Compatibility (${{ matrix.python-version }})
    timeout-minutes: 45
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-quality.txt
      - name: Bootstrap project-local Python
        run: python scripts/bootstrap_project_venv.py
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Supply-chain hardening check
        run: python scripts/check_supply_chain_hardening.py
      - name: Install compatibility test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-quality.txt
          python -m pip install numpy pillow aiohttp "coverage[toml]"
      - name: R120 preflight
        run: python scripts/preflight_check.py --strict
      - name: Run exact-version backend suite
        env:
          OPENCLAW_STATE_DIR: ${{ github.workspace }}/openclaw_state/_ci_python_${{ matrix.python-version }}
        run: |
          python scripts/run_unittests.py --start-dir tests --pattern "test_*.py" --enforce-skip-policy tests/skip_policy.json
      - name: Emit successful exact-version evidence
        run: |
          python scripts/python_compatibility_evidence.py emit --expected-version "${{ matrix.python-version }}" --commit "${{ github.sha }}" --output ".tmp/python-compatibility/python-${{ matrix.python-version }}.json"
      - name: Upload successful exact-version evidence
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: python-compatibility-${{ matrix.python-version }}
          path: .tmp/python-compatibility/python-${{ matrix.python-version }}.json
          retention-days: 30
